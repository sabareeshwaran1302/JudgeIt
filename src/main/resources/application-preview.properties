# Opt-in local UI demo. Start with run-preview.sh or run-preview.cmd.
# H2 is only on the test classpath; the normal application still uses MySQL.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:judgeit-preview;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
