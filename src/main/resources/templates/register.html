<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('account')}"></header>
<main id="main" class="page auth-page" tabindex="-1">
    <div th:replace="~{fragments/layout :: feedback}"></div>

    <section class="panel auth-panel"><p class="eyebrow">A PLACE TO PRACTICE</p><h1>Start your next chapter.</h1><p class="muted">Create your JudgeIt account.</p><form th:action="@{/register}" th:object="${user}" method="post"><div class="notice error-notice" th:if="${#fields.hasAnyErrors()}" role="alert">Please correct the fields below to create your account.</div>
    <label for="name">Name</label><input id="name" th:field="*{name}" autocomplete="name" maxlength="100" required aria-describedby="name-error" th:attr="aria-invalid=${#fields.hasErrors('name')}"><p id="name-error" class="field-error" th:errors="*{name}"></p>
    <label for="email">Email address</label><input type="email" id="email" th:field="*{email}" autocomplete="email" maxlength="150" required aria-describedby="email-error" th:attr="aria-invalid=${#fields.hasErrors('email')}"><p id="email-error" class="field-error" th:errors="*{email}"></p>
    <label for="password">Password</label><input type="password" id="password" name="password" minlength="6" maxlength="100" autocomplete="new-password" required aria-describedby="password-hint password-error" th:attr="aria-invalid=${#fields.hasErrors('password')}"><p id="password-hint" class="field-hint">Use between 6 and 100 characters.</p><p id="password-error" class="field-error" th:errors="*{password}"></p><button class="button full" type="submit">Create account →</button></form><p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p></section>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
