<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add a problem')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('problems')}"></header>
<main id="main" class="page narrow" tabindex="-1">
    <div th:replace="~{fragments/layout :: feedback}"></div>

    <a class="back-link" th:href="@{/problems}">← All problems</a><div class="page-heading"><div><p class="eyebrow">PROBLEM MANAGEMENT</p><h1>Add a problem</h1><p class="muted">Give the next solver a clear challenge to work through.</p></div></div>
    <section class="panel form-panel"><form th:action="@{/problems}" th:object="${problem}" method="post">
        <div class="notice error-notice" role="alert" th:if="${#fields.hasAnyErrors()}">Please correct the fields marked below, then save again.</div>
        <label for="title">Problem title <span class="caption">(required)</span></label><input id="title" th:field="*{title}" maxlength="150" required aria-describedby="title-error" th:attr="aria-invalid=${#fields.hasErrors('title')}"><p id="title-error" class="field-error" th:errors="*{title}"></p>
        <label for="difficulty">Difficulty <span class="caption">(required)</span></label><select id="difficulty" th:field="*{difficulty}" required aria-describedby="difficulty-error" th:attr="aria-invalid=${#fields.hasErrors('difficulty')}"><option value="">Select difficulty</option><option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Hard">Hard</option></select><p id="difficulty-error" class="field-error" th:errors="*{difficulty}"></p>
        <label for="description">Problem statement <span class="caption">(required)</span></label><p class="field-hint" id="description-hint">Include the task, input/output format, and examples. Up to 5,000 characters.</p><textarea id="description" th:field="*{description}" rows="10" maxlength="5000" required aria-describedby="description-hint description-error" th:attr="aria-invalid=${#fields.hasErrors('description')}"></textarea><p id="description-error" class="field-error" th:errors="*{description}"></p>
        <div class="actions"><button class="button" type="submit">Create problem</button><a class="button secondary" th:href="@{/problems}">Cancel</a></div>
    </form></section>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
