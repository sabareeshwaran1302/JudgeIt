<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('account')}"></header>
<main id="main" class="page auth-page" tabindex="-1">
    <div th:replace="~{fragments/layout :: feedback}"></div>

    <section class="panel auth-panel"><p class="eyebrow">WELCOME BACK</p><h1>Keep the ideas coming.</h1><p class="muted">Log in to your JudgeIt account.</p><div class="notice error-notice" th:if="${loginError}" th:text="${loginError}" role="alert"></div>
    <form th:action="@{/login}" th:object="${user}" method="post"><label for="email">Email address</label><input type="email" id="email" th:field="*{email}" autocomplete="username" maxlength="150" required><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required><button class="button full" type="submit">Log in →</button></form><p class="auth-switch">New here? <a th:href="@{/register}">Create an account</a></p></section>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
