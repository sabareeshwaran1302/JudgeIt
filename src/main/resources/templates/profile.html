<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('profile')}"></header>
<main id="main" class="page narrow" tabindex="-1">
    <div th:replace="~{fragments/layout :: feedback}"></div>

    <div class="page-heading"><div><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome, <span th:text="${user.name}">coder</span>.</h1><p class="muted">A good day to take on a new challenge.</p></div></div><section class="panel form-panel"><h2>Profile details</h2><dl class="profile-details"><dt>Name</dt><dd th:text="${user.name}">Name</dd><dt>Email address</dt><dd th:text="${user.email}">Email</dd></dl><div class="actions"><a class="button" th:href="@{/problems}">Find a problem →</a><a class="button secondary" th:href="@{/logout}">Log out</a></div></section>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
